name: Update News-Snapshot

# Läuft manuell (Run workflow-Button) plus automatisch alle 3 Stunden, damit
# frisch veröffentlichte News zeitnah auch im statischen HTML auftauchen.
# Ändert AUSSCHLIESSLICH den Text zwischen den SNAPSHOT:NEWS-Markern in
# index.html. Regelwerk und der Rest der Datei bleiben unangetastet.
on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 */3 * * *"

permissions:
  contents: write

jobs:
  news-snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Supabase-Client installieren
        run: npm install @supabase/supabase-js

      - name: News-Snapshot generieren
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node scripts/generate-news-snapshot.mjs

      - name: Änderungen committen (nur wenn vorhanden)
        run: |
          git config user.name "cdl-news-bot"
          git config user.email "actions@github.com"
          if git diff --quiet -- index.html; then
            echo "Keine Änderungen am News-Snapshot - kein Commit nötig."
          else
            git add index.html
            git commit -m "chore: News-Snapshot aktualisiert"
            git push
          fi
