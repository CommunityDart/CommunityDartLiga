name: Update Regelwerk-Snapshot

# Läuft NUR manuell (Run workflow-Button) plus einmal täglich als Sicherheitsnetz,
# falls das Regelwerk geändert wurde und der manuelle Klick vergessen wird.
# Ändert AUSSCHLIESSLICH den Text zwischen den SNAPSHOT:REGELWERK-Markern in
# index.html. Die News-Marker und der Rest der Datei bleiben unangetastet.
on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 4 * * *"

permissions:
  contents: write

jobs:
  regelwerk-snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Supabase-Client installieren
        run: npm install @supabase/supabase-js

      - name: Regelwerk-Snapshot generieren
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node scripts/generate-regelwerk-snapshot.mjs

      - name: Änderungen committen (nur wenn vorhanden)
        run: |
          git config user.name "cdl-regelwerk-bot"
          git config user.email "actions@github.com"
          if git diff --quiet -- index.html; then
            echo "Keine Änderungen am Regelwerk-Snapshot - kein Commit nötig."
          else
            git add index.html
            git commit -m "chore: Regelwerk-Snapshot aktualisiert"
            git push
          fi
